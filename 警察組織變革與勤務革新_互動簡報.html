const slides=[{"title": "警察不是萬能，為什麼什麼都要管？", "subtitle": "從組織變革到勤務革新", "label": "封面", "script": "各位同學大家好，今天要報告警察組織變革與勤務革新。先問一個問題：如果社會大小事都要找警察，那警察真正的核心工作是什麼？今天從三通110來電、制度問題到改革決策，一起來思考。", "duration": 30, "content": "<div class=\"hero\"><div class=\"eyebrow\">CHAPTER 11 · POLICE REFORM<\/div><h1>警察不是萬能<br><em>為什麼什麼都要管？<\/em><\/h1><p>警察組織變革與勤務革新<\/p><div class=\"hero-meta\">組織 × 任務 × 業務 × 勤務　｜　課堂互動專題報告<\/div><\/div>"}, {"title": "110 模擬派遣中心", "subtitle": "三通電話，該不該派警？", "label": "互動", "script": "請大家扮演值班員警。民眾車門反鎖、隔壁疑似家暴、路邊有動物屍體。每題請大家選擇派警、轉介或提供指引。重點不是每題都有唯一固定答案，而是要依急迫危害、法定權責與可用資源判斷。警察不是萬能客服，但有緊急人身危險時不能消極處理。", "duration": 120, "content": "<div class=\"tag good\">互動 01｜110 模擬派遣<\/div><div class=\"dispatch\"><div class=\"dispatch-top\"><span>● 110 DISPATCH<\/span><span id=\"caseCount\">CASE 01 / 03<\/span><\/div><h2 id=\"caseTitle\">車門反鎖<\/h2><blockquote id=\"caseQuote\">「車鑰匙鎖在車子裡，可以請警察幫忙嗎？」<\/blockquote><div class=\"choice-row\"><button data-call=\"0\">立即派警<\/button><button data-call=\"1\">轉介主管機關<\/button><button data-call=\"2\">提供其他協助資訊<\/button><\/div><div class=\"reveal\" id=\"caseReveal\" aria-live=\"polite\"><\/div><button class=\"small-btn\" id=\"nextCase\">下一通電話 →<\/button><\/div><p class=\"tiny\">教學模擬：實務須依具體危害、法規、勤務指揮及現場情況判斷。<\/p>"}, {"title": "警察為什麼越來越忙？", "subtitle": "制度未必跟得上環境變化", "label": "課本前言", "script": "全球化、科技化、高齡化及跨境詐騙，使警察的工作情境比過去複雜。課本指出2014年的組織改造，犯罪預防分工仍有待整合。今天不只是問警察夠不夠努力，更要問制度是否合理配置資源。", "duration": 60, "content": "<div class=\"four\"><div class=\"tile\"><span>01 / ENVIRONMENT<\/span><h3>社會變遷<\/h3><p>全球化、高齡化、多元需求<\/p><\/div><div class=\"tile\"><span>02 / CRIME<\/span><h3>犯罪升級<\/h3><p>詐欺、網路、跨境協作<\/p><\/div><div class=\"tile\"><span>03 / STRUCTURE<\/span><h3>分工重疊<\/h3><p>預防體系多頭管理<\/p><\/div><div class=\"tile\"><span>04 / WORKLOAD<\/span><h3>勤務過載<\/h3><p>協辦事項、輪班、健康<\/p><\/div><\/div><div class=\"statement\">犯罪手法已升級，<em>警察制度有跟著升級嗎？<\/em><\/div>"}, {"title": "四個概念，一條問題鏈", "subtitle": "組織 → 任務 → 業務 → 勤務", "label": "核心定義", "script": "四個名詞要分清楚。組織是誰負責，任務是為什麼存在，業務是具體要做什麼，勤務是用什麼方式去做。以防詐為例，警察機關承辦，因為有保護安全的法定任務，因此發展防詐業務，再依規劃執行相關勤務。如果任務邊界過於寬泛，業務及勤務負荷可能跟著擴張。", "duration": 60, "content": "<div class=\"chain\"><div><b>組織<\/b><strong>誰負責？<\/strong><small>警政署、警察局、分局<\/small><\/div><i>→<\/i><div><b>任務<\/b><strong>為什麼做？<\/strong><small>維持秩序、保護安全<\/small><\/div><i>→<\/i><div><b>業務<\/b><strong>做什麼？<\/strong><small>防詐、交通、治安<\/small><\/div><i>→<\/i><div><b>勤務<\/b><strong>怎麼做？<\/strong><small>巡邏、值班、臨檢等<\/small><\/div><\/div><div class=\"statement\">上游任務不清楚，<em>下游勤務就可能越來越多。<\/em><\/div>"}, {"title": "三種公共行政視角", "subtitle": "改革不只是效率，也關乎信任", "label": "理論", "script": "Daft等組織變革觀點提醒組織要適應環境。新公共管理重效率和績效；新公共服務強調民眾是公民，不只是顧客。對警政而言，不能只追求案件數或勤務件數，還需要守住公共利益、權利保障和信任。", "duration": 60, "content": "<div class=\"three\"><div class=\"tile\"><div class=\"num\">01<\/div><h3>組織變革<\/h3><p>能否回應環境變化？<\/p><b>調整結構與分工<\/b><\/div><div class=\"tile\"><div class=\"num\">02<\/div><h3>新公共管理<\/h3><p>資源有沒有效率？<\/p><b>績效、成本、服務<\/b><\/div><div class=\"tile\"><div class=\"num\">03<\/div><h3>新公共服務<\/h3><p>公民是否受到尊重？<\/p><b>公共利益與互信<\/b><\/div><\/div><div class=\"statement\">有績效，不代表一定有<em>公共價值。<\/em><\/div>"}, {"title": "2014 組織改造留下什麼？", "subtitle": "調整單位，不等於改變分工邏輯", "label": "組織困境", "script": "課本回顧2014年警察組織改造，包括部分科室整併與更名。問題在於犯罪預防工作仍散見不同單位。這不是說組織改造完全無效，而是問它是否解決跨單位協調的根本問題。", "duration": 75, "content": "<div class=\"split\"><div class=\"panel\"><div class=\"kicker\">課本回顧 / 2014<\/div><h3>曾做的調整<\/h3><p>科室整併、名稱調整、業務移轉<\/p><div class=\"bigmark\">組織圖更新 ✓<\/div><\/div><div class=\"panel accent\"><div class=\"kicker\">未解決的疑問<\/div><h3>預防工作誰統籌？<\/h3><p>宣導、民力運用、防治及行政工作分散<\/p><div class=\"bigmark\">協作流程更新 ？<\/div><\/div><\/div><div class=\"statement\">改了名稱，<em>責任就會變清楚嗎？<\/em><\/div>"}, {"title": "警察組織的四大困境", "subtitle": "從機關分工一路影響到第一線", "label": "四大困境", "script": "課本把問題整理成組織、任務、業務、勤務四個層次。組織面重複分工，任務面法條範圍廣泛，業務面協辦和主辦界線模糊，勤務面則產生大量執行負擔。這不是四個獨立問題，而是一條連鎖反應。", "duration": 75, "content": "<div class=\"four\"><div class=\"tile\"><span>01<\/span><h3>組織面<\/h3><p>犯罪預防分工重疊<\/p><\/div><div class=\"tile\"><span>02<\/span><h3>任務面<\/h3><p>法定任務範圍廣泛<\/p><\/div><div class=\"tile\"><span>03<\/span><h3>業務面<\/h3><p>主辦、協辦界線模糊<\/p><\/div><div class=\"tile\"><span>04<\/span><h3>勤務面<\/h3><p>工作量與勤休負荷增加<\/p><\/div><\/div><div class=\"statement\">制度上的模糊，最後往往由<em>基層吸收。<\/em><\/div>"}, {"title": "110 是萬能客服中心嗎？", "subtitle": "為民服務：保護需求與資源分流", "label": "課本統計", "script": "按照課本整理，2021至2023年110受理案件中，為民服務案件達586萬餘件，比例超過三成。這是課本所引的歷史期間數字，不是2026年的最新數據。為民服務也不能全視為非警察業務；如迷途失智者、急迫危害等可能有高度保護必要。我們真正要討論的是案件分流標準。", "duration": 100, "content": "<div class=\"metric\"><div class=\"metric-left\"><div class=\"kicker\">課本統計｜2021–2023<\/div><div class=\"gigantic\">586<span>萬餘件<\/span><\/div><p>110 受理案件中的「為民服務」類別<\/p><\/div><div class=\"metric-right\"><div class=\"donut\"><div>超過<br><strong>30%<\/strong><\/div><\/div><small>比例為概念示意，非精確占比<\/small><\/div><\/div><div class=\"statement\">不是所有「為民服務」都該拒絕，<em>而是要正確分流。<\/em><\/div>"}, {"title": "你的派遣標準是什麼？", "subtitle": "分流不是推託：急迫風險與權責判斷", "label": "互動", "script": "請同學判斷三種狀況：單純叫鎖匠、車內嬰兒受困、民眾疑似遭詐騙正在匯款。我們用急迫性、法定職權、替代資源三項作初步篩選。但不能把這三項當成取代法律的機械公式，最終仍須個案判斷。", "duration": 90, "content": "<div class=\"tag good\">互動 02｜案件分流快問快答<\/div><div class=\"question\"><h2>什麼情況需要立即警察介入？<\/h2><div class=\"scenario\" id=\"scenarioText\">「單純把車鑰匙鎖在車內，沒有其他危險」<\/div><div class=\"choice-row\"><button data-s=\"0\">急迫派警<\/button><button data-s=\"1\">轉介或指引<\/button><\/div><div class=\"reveal\" id=\"scenarioReveal\"><\/div><button class=\"small-btn\" id=\"nextScenario\">下一題 →<\/button><\/div><div class=\"pillset\"><span>① 危害急迫性<\/span><span>② 法定權責<\/span><span>③ 替代處理資源<\/span><\/div>"}, {"title": "日本生活安全警察的啟發", "subtitle": "從「事後處理」走向「預防與生活安全」", "label": "國際借鏡", "script": "課本介紹日本1994年設立生活安全局，強化生活安全、預防犯罪及保安等分工。值得借鏡的不是直接複製機關名稱，而是思考如何整合與市民生活密切相關的預防工作。但也要考慮台灣現有機關的權責與資源。", "duration": 75, "content": "<div class=\"split\"><div class=\"panel\"><div class=\"kicker\">JAPAN · 1994<\/div><h2>生活安全局<\/h2><p>生活安全、犯罪預防、保安等職能統整<\/p><div class=\"bigmark\">預防導向<\/div><\/div><div class=\"panel\"><div class=\"kicker\">對臺灣的啟示<\/div><h2>整合，不是複製<\/h2><p>釐清權責、整合宣導與民力、強化跨域合作<\/p><div class=\"bigmark\">因地制宜<\/div><\/div><\/div><div class=\"statement\">成立新單位，<em>能否真的減少多頭馬車？<\/em><\/div>"}, {"title": "六種勤務方式，夠用了嗎？", "subtitle": "現行法 vs 課本修法建議", "label": "現行法與修法", "script": "依警察勤務條例第11條，目前列有勤區查察、巡邏、臨檢、守望、值班、備勤六種勤務方式。課本認為出庭作證、防詐專案、調閱監視器等實務工作難以完整呈現，建議增列專屬勤務和待命服勤。請注意，八種是課本建議，不是現行條文。另外，具體工作究竟應歸類哪種勤務，仍需要配合現行規範細查。", "duration": 105, "content": "<div class=\"tag\">現行法｜《警察勤務條例》第 11 條<\/div><div class=\"duty-grid\"><div>勤區查察<\/div><div>巡邏<\/div><div>臨檢<\/div><div>守望<\/div><div>值班<\/div><div>備勤<\/div><\/div><div class=\"addline\">＋<\/div><div class=\"tag warn\">課本建議增列｜尚非現行第 11 條法定類型<\/div><div class=\"duty-grid two\"><div>專屬勤務 <small>如出庭、防詐專案<\/small><\/div><div>待命服勤 <small>如監視器調閱、業務整理<\/small><\/div><\/div><p class=\"tiny\">資料來源：全國法規資料庫《警察勤務條例》第 11 條；新增二項為課本主張。<\/p>"}, {"title": "釋字第 785 號：警察也有休息權", "subtitle": "不能只要求使命感，卻忽略健康權", "label": "憲法保障", "script": "釋字785號針對特殊勤務機關的勤休制度，強調服勤時數合理上限、休假頻率、連續休息與超勤補償應具有符合憲法要求的規範。這項解釋也涉及消防等機關，不能說它只針對警察。改革不只是排表方便，更涉及服公職權和健康權。", "duration": 95, "content": "<div class=\"split\"><div class=\"panel\"><div class=\"kicker\">憲法第 18 條<\/div><h2>服公職權<\/h2><p>勤務制度與法定補償有權利保障<\/p><\/div><div class=\"panel accent\"><div class=\"kicker\">憲法第 22 條<\/div><h2>健康權<\/h2><p>勤休制度須保護身心健康<\/p><\/div><\/div><div class=\"pillset\"><span>合理工時上限<\/span><span>適當休息頻率<\/span><span>連續休息<\/span><span>超勤補償<\/span><\/div><div class=\"statement\">休息不是獎勵，<em>合理勤休是制度責任。<\/em><\/div>"}, {"title": "四大改革方案", "subtitle": "組織、法令、業務、勤務一起改", "label": "課本建議", "script": "第一，整合犯罪預防體系，評估生活安全專責組織。第二，修正警察法使任務更明確，並建立警察補充性原則的法制依據。第三，盤點協辦業務，讓環保、衛生、動保等專業行政機關強化本身權責，課本也提到特別司法警察等制度選項。第四，研修勤務條例與案件分流標準。以上是課本的改革主張，不能當成已生效制度。", "duration": 105, "content": "<div class=\"four reforms\"><div class=\"tile\"><span>組織改革<\/span><h3>整合犯罪預防<\/h3><p>生活安全專責體系<\/p><\/div><div class=\"tile\"><span>任務改革<\/span><h3>明確警察法<\/h3><p>任務界線、補充性原則<\/p><\/div><div class=\"tile\"><span>業務改革<\/span><h3>限縮協辦<\/h3><p>專業機關各司其職<\/p><\/div><div class=\"tile\"><span>勤務改革<\/span><h3>勤務分類與分流<\/h3><p>勤休、人力與法制明確化<\/p><\/div><\/div><div class=\"tag warn\">本頁均屬課本改革建議，不代表已完成修法<\/div>"}, {"title": "如果你是警政署長？", "subtitle": "預算與人力有限，你優先做什麼？", "label": "互動", "script": "最後一個活動請大家扮演署長。四個方案都值得考慮，但人力和預算有限，你會先推哪個？請選擇後說出好處和可能障礙。A整合組織，B限縮協辦，C優化勤休，D智慧分流。D是額外延伸構想，並非課本原方案。注意改革並非只有單選一題，這是在練習排序與取捨。", "duration": 130, "content": "<div class=\"tag good\">互動 03｜署長決策室<\/div><h2 class=\"interactive-title\">你只有一筆改革預算，第一步做什麼？<\/h2><div class=\"four vote\" id=\"votes\"><button data-v=\"0\"><b>A<\/b>整合生活安全組織<\/button><button data-v=\"1\"><b>B<\/b>限縮協辦業務<\/button><button data-v=\"2\"><b>C<\/b>改善勤休制度<\/button><button data-v=\"3\"><b>D<\/b>智慧派遣與案件分流<\/button><\/div><div id=\"voteReveal\" class=\"reveal visible\">點擊選項，檢視效益與落實障礙。<\/div><p class=\"tiny\">D 為本報告延伸提案，其餘對應課本改革方向。教學目的在分析取捨，無唯一正解。<\/p>"}, {"title": "結論：做更多，還是做得更好？", "subtitle": "警察不必包辦所有事，卻要守住最關鍵的安全", "label": "結論", "script": "最後回到最初的三通電話。不是所有有需求的事件都應由警察一肩扛起，也不是把為民服務視為負擔就可以一律拒絕。改革的重點，是權責明確、專業分流、合理勤務與員警健康。當制度把工作放在對的位置，警察才能在最需要的地方發揮真正專業。謝謝大家。", "duration": 80, "content": "<div class=\"end\"><div class=\"eyebrow\">THE REAL QUESTION<\/div><h1>警察應該做更多，<br>還是<em>做得更好？<\/em><\/h1><p>權責清楚　×　專業分流　×　合理勤休　×　生活安全<\/p><div class=\"closing\">讓警力用在真正需要警察的地方。<\/div><\/div>"}];let current=0;const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const cases=[{title:'車門反鎖',q:'「車鑰匙鎖在車子裡，可以請警察幫忙嗎？」',a:'一般無急迫危險：原則上提供鎖匠／道路救援指引。若有人受困或發生緊急危險，須重新評估。'},{title:'疑似家庭暴力',q:'「隔壁有人被打，還一直喊救命！」',a:'涉及急迫人身安全危險，應評估並即時派遣警力依法處理。'},{title:'路邊動物屍體',q:'「路邊有一隻死豬，味道很重。」',a:'通常由環保、清潔或動物防疫等權責機關處理；若涉及交通危害、犯罪或依法協助則應個案處置。'}];let caseIndex=0;const scenarios=[['「單純車門反鎖，沒有其他立即危險」','原則上轉介或提供指引；無需單純因服務需求就立即派警。'],['「炎熱天氣，嬰兒受困在反鎖車內」','可能有急迫生命身體危害，應立即啟動緊急協助。'],['「長者疑似正在遭詐騙，準備到銀行匯款」','應即時評估詐騙風險與可採取的阻詐、通報或派遣協助。']];let scenarioIndex=0;const votes=[['效益：統整犯罪預防與生活安全業務。','障礙：重組成本高，跨單位分工與人力調整複雜。'],['效益：讓基層聚焦治安、交通與急迫保護。','障礙：其他機關須有足夠人力與法定執行能力。'],['效益：改善工時與員警健康，維持服務品質。','障礙：輪班覆蓋、人力缺口與預算。'],['效益：輔助案件分類，節省重複行政工時。','障礙：誤判風險、個資與系統治理；此為報告延伸構想。']];
function render(){const s=slides[current];$('slide').innerHTML=`${current===0||current===14?'':`<div class="slide-head"><span>${pad(current+1)} / 15</span><span>—</span><span>${s.label}</span></div><h1 class="slide-title">${s.title}</h1><p class="slide-subtitle">${s.subtitle}</p>`}<div class="slide-body">${s.content}</div><div class="slide-footer"><span>警察組織變革與勤務革新</span><span>${pad(current+1)} / 15 · ${Math.floor(s.duration/60)}:${pad(s.duration%60)}</span></div>`;$('counter').textContent=`${pad(current+1)} / ${slides.length}`;$('progress').style.width=`${(current+1)/slides.length*100}%`;$('noteTitle').textContent=s.title;$('noteTime').textContent=`建議講述時間 ${Math.floor(s.duration/60)} 分 ${s.duration%60} 秒`;$('noteScript').textContent=s.script;wire();}function nav(delta){current=Math.max(0,Math.min(slides.length-1,current+delta));render();}function wire(){if(current===1){caseIndex=0;updateCase();document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{$('caseReveal').classList.add('visible');$('caseReveal').textContent=cases[caseIndex].a;document.querySelectorAll('[data-call]').forEach(x=>x.classList.toggle('selected',x===b));});$('nextCase').onclick=()=>{caseIndex=(caseIndex+1)%3;updateCase();};}if(current===8){scenarioIndex=0;updateScenario();document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{$('scenarioReveal').classList.add('visible');$('scenarioReveal').textContent=scenarios[scenarioIndex][1];document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('selected',x===b));});$('nextScenario').onclick=()=>{scenarioIndex=(scenarioIndex+1)%3;updateScenario();};}if(current===13){document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=+b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('selected',x===b));$('voteReveal').textContent=votes[v].join('　｜　');$('voteReveal').classList.add('visible');});}}function updateCase(){$('caseTitle').textContent=cases[caseIndex].title;$('caseQuote').textContent=cases[caseIndex].q;$('caseCount').textContent=`CASE ${pad(caseIndex+1)} / 03`;$('caseReveal').textContent='請先讓同學選擇，再公布參考判斷。';$('caseReveal').classList.remove('visible');document.querySelectorAll('[data-call]').forEach(x=>x.classList.remove('selected'));}function updateScenario(){$('scenarioText').textContent=scenarios[scenarioIndex][0];$('scenarioReveal').textContent='請同學作答，點擊選項揭曉判斷。';$('scenarioReveal').classList.remove('visible');document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('selected'));}function notes(on){$('notes').classList.toggle('open',on)}$('next').onclick=()=>nav(1);$('prev').onclick=()=>nav(-1);$('notesBtn').onclick=()=>notes(!$('notes').classList.contains('open'));$('closeNotes').onclick=()=>notes(false);$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();nav(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();nav(-1)}else if(e.key.toLowerCase()==='n')notes(!$('notes').classList.contains('open'));else if(e.key.toLowerCase()==='f')$('fsBtn').click();else if(e.key==='Escape')notes(false)});render();
</script></body></html>
